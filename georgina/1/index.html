<script type="application/json" id="data">{"title":"Georgina · 5 November","student":"Georgina","tutor":"Matt","sections":[{"t":0,"title":"Greeting and recording setup","summary":"Georgina says she is busy, and the tutor asks permission to record and agrees with her which platform to use."},{"t":108.0,"title":"Busy week: cruises and shopping","summary":"Georgina explains her mom's cruise discount and the cancelled order, then describes her online clothing purchases for the Antarctica trip."},{"t":388.0,"title":"Weekend plans and accounting work","summary":"Georgina describes checking business bills and receipts for the accountant, and they practise saying 'once every two months'."},{"t":656.0,"title":"Discussion questions: retraining, comments, routine","summary":"Georgina works through spin-wheel questions on who should pay for retraining and on choosing routine, with the tutor clarifying vocabulary and meaning."},{"t":1474.0,"title":"Pilates, yoga and routine","summary":"The student explains that she likes Pilates and yoga but needs a coach, because she is afraid of getting injured on her own."},{"t":1601.0,"title":"No meetings or no emails","summary":"The student works through the question, chooses to keep online meetings over email, and learns the word coworker."},{"t":1932.0,"title":"A coach for a day and shrinking back","summary":"The student picks an English coach to correct her, learns what shrink back means, and links it to being scared of talking to people."},{"t":2265.0,"title":"Spending, treating yourself and the winter debate","summary":"The student talks about giving money while traveling, rewards from work, and begins the question about winter in Taiwan."},{"t":3022.0,"title":"Cool weather and winter rain","summary":"The student checks the spelling of 'cool' and says winter in Taipei and Yilan is rainy, while Kaohsiung is the focus."},{"t":3058.0,"title":"Showing a visitor Kaohsiung","summary":"The student suggests the mountain, Cijin, the Pier-2 area "I go to the Germany","better":"I go to Germany","kind":"grammar","why":"Country names usually don't take 'the'.","t":880.0},{"said":"I need listen to my coach","better":"I need to listen to my coach","kind":"grammar","why":"After 'need' use 'to' plus the base verb.","t":1503.0},{"said":"we can talking","better":"we can talk","kind":"grammar","why":"After a modal verb like 'can', use the base verb without -ing.","t":1781.0},{"said":"you need speak English for everybody","better":"you need to speak English to everybody","kind":"grammar","why":"Use 'need to' plus the base verb, and 'speak to' someone.","t":2184.0},{"said":"I scared talking with the, the other people","better":"I'm scared of talking with the other people","kind":"grammar","why":"'Scared' needs the verb 'be' ('I'm') and the preposition 'of' before -ing.","t":2202.0},{"said":"the coach need say you need to go","better":"the coach needs to say you need to go","kind":"grammar","why":"Use 'needs' with a singular subject, followed by 'to' and the base verb.","t":2210.0},{"said":"very, very cheaper","better":"very, very cheap","kind":"grammar","why":"Do not use the comparative 'cheaper' after 'very'; use the plain adjective 'cheap'.","t":2454.0},{"said":"I go to the Italy","better":"I went to Italy","kind":"grammar","why":"Use the past tense for a past trip, and country names usually have no 'the'.","t":2512.0},{"said":"the Italy have a many, many, uh, liar","better":"Italy has many, many liars","kind":"grammar","why":"Country names have no 'the', 'Italy' takes 'has', and 'many' goes with a plural noun without 'a'.","t":2522.0},{"said":"Give me a money","better":"Give me some money","kind":"grammar","why":"'Money' is uncountable, so use 'some' and not 'a'.","t":2593.0},{"said":"you have a finish a big project","better":"you have finished a big project","kind":"grammar","why":"The present perfect is 'have' plus the past participle 'finished'.","t":2669.0},{"said":"many, many company is a small company","better":"many, many companies are small companies","kind":"grammar","why":"'Many' needs a plural noun and a plural verb.","t":2816.0},{"said":"all day is rainy","better":"it's rainy all day","kind":"structure","why":"In English the usual pattern is 'it's rainy all day', with 'all day' at the end.","t":3041.0},{"said":"It's a cold.","better":"It's cold.","kind":"grammar","why":"'Cold' is an adjective here, so it does not take 'a'.","t":3113.0},{"said":"a near small island","better":"a small island nearby","kind":"word choice","why":"'Near' is not usually placed before a noun like this. 'Nearby' goes after it.","t":3149.0},{"said":"have a many, many fish boat","better":"has many, many fishing boats","kind":"grammar","why":"The singular subject '旗津' takes 'has'. 'Many' needs no 'a' and a plural noun, and 'fishing boats' is the natural phrase.","t":3189.0},{"said":"Maybe you can go to the sunset.","better":"Maybe you can go see the sunset.","kind":"word choice","why":"You 'go see' or 'watch' a sunset. 'Go to' is for places.","t":3274.0},{"said":"one month or two month","better":"one month or two months","kind":"grammar","why":"Use the plural 'months' after 'two'.","t":3333.0},{"said":"wear T-shirt","better":"wear a T-shirt","kind":"grammar","why":"'T-shirt' is a countable noun, so it needs 'a' or a plural form.","t":3346.0},{"said":"down than the 高雄","better":"lower than the 高雄","kind":"word choice","why":"Use 'lower than' to compare temperatures. 'Down than' is not a standard comparison.","t":3402.0},{"said":"is raining there long time","better":"has been raining there for a long time","kind":"grammar","why":"An action that started in the past and continues now uses the present perfect continuous, and 'for a long time' needs 'for a'.","t":3422.0},{"said":"He said","better":"She said","kind":"grammar","why":"Grandma is a woman, so the pronoun should be 'she'.","t":3930.0}],"patterns":[{"title":"Missing 'to' after 'need'","tip":"After 'need', use 'to' plus the base verb: 'I need to check', 'you need to speak'. With he/she/it, add -s to 'need': 'the coach needs to say'.","examples":[6,8,10,12,14]},{"title":"Subject-verb agreement","tip":"Make the verb match the subject. Singular subjects take -s ('my mom says', 'Italy has'). Plural subjects like 'clothes' and 'many companies' take 'are'.","examples":[1,7,14,17,20,24]},{"title":"Adding 'the' before country names","tip":"Most country names don't take 'the': say 'I go to Germany' and 'I went to Italy'.","examples":[9,16,17]},{"title":"Extra 'a' before uncountable nouns, 'many' and adjectives","tip":"Don't use 'a' before 'many', before uncountable nouns like 'money', or before a bare adjective like 'cold'. Use 'some money', 'many fishing boats' and 'It's cold'.","examples":[17,18,22,24]},{"title":"Plural endings and missing articles on countable nouns","tip":"Add -s to countable nouns after a number ('two months', '2,000 dollars'). Singular countable nouns need 'a', as in 'a T-shirt'. Uncountable nouns like 'underwear' need a measure phrase, as in 'two pairs of underwear'.","examples":[3,4,26,27]},{"title":"Past tense and perfect forms","tip":"Use the past tense for finished events ('saved', 'went'). Use have + past participle for the present perfect ('have finished'), and 'has been raining for a long time' for something still continuing.","examples":[2,16,19,29]}],"transcript":[{"t":16.9,"who":"Matt","role":"tutor","text":"Hello, how are you, Georgina?"},{"t":20.5,"who":"Georgina","role":"student","text":"So busy. Because my mom—"},{"t":22.0,"who":"Matt","role":"tutor","text":"Oh, yeah? Um, before we— before we start, is it okay if I record you right now?"},{"t":29.0,"who":"Matt","role":"tutor","text":"I'm testing something that I'm building. It's only going to record your audio, so no, no webcam or anything."},{"t":38.0,"who":"Georgina","role":"student","text":"對, if I will use the LINE talk, it's okay."},{"t":44.0,"who":"Matt","role":"tutor","text":"Oh, you don't want to use Instagram to t <script>
const D = JSON.parse($('data').textContent), P = setupPage('./');
$('title').textContent = D.title;
$('sub').textContent = `${D.moments.length} moments to improve · ${D.patterns.length} patterns`;
const atButton = t => { const b = el('button', 'at', clock(t)); b.setAttribute('aria-label', 'Play from ' + clock(t)); b.onclick = () => P.at(t); return b; };
const box = (cls, label, text, veiled) => {
  const b = el('div', cls + (veiled ? ' veil' : '')); b.append(el('div', 'lab', label), el('div', 'txt', text));
  if (veiled) { b.append(el('div', 'hint', 'Tap to reveal')); b.tabIndex = 0; b.onclick = b.onkeydown = e => { if (!e.key || e.key === 'Enter' || e.key === ' ') b.classList.add('shown'); }; }
  return b;
};
const moment = (m, compact) => {
  const c = el('div', compact ? '' : 'card'), head = el('div', 'head');
  head.append(atButton(m.t)); if (m.kind) head.append(el('span', 'kind', m.kind));
  const pair = el('div', 'pair'); pair.append(box('said', 'You said', m.said), box('better', 'Try', m.better, true));
  c.append(head, pair); if (m.why) c.append(el('p', 'why', m.why));
  return c;
};
for (const p of D.patterns) {
  const c = el('div', 'card'); c.append(el('h2', null, p.title), el('p', 'tip', p.tip));
  (p.examples || []).forEach((i, k) => { if (D.moments[i]) { if (k) c.append(el('div', 'sub')); c.append(moment(D.moments[i], true)); } });
  $('patterns').append(c);
}
D.moments.forEach(m => $('moments').append(moment(m)));
const lines = [], times = [];
let s = 0;
for (const r of D.transcript) {
  while (s < D.sections.length && D.sections[s].t <= r.t) { const t = el('div', 'topic'); t.append(el('h3', null, D.sections[s].title), el('p', null, D.sections[s].summary)); $('talk').append(t); s++; }
  const ln = el('div', 'ln ' + r.role); ln.append(atButton(r.t), el('span', 'who', r.who), el('span', null, r.text));
  $('talk').append(ln); lines.push(ln); times.push(r.t);
}
let playing = -1;
P.onTime(t => { const i = lastAtOrBefore(times, t + 0.05); if (i !== playing) { lines[playing]?.classList.remove('playing'); lines[i]?.classList.add('playing'); playing = i; } });
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  ['patterns', 'moments', 'talk'].forEach(v => $(v).classList.toggle('hidden', v !== b.dataset.v));
});
</script></body></html>
